name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. ESLint клиент ────────────────────────────────────────────────────────
  client-lint:
    name: ESLint (client)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install client dependencies
        run: npm install --legacy-peer-deps

      - name: Run ESLint (0 errors, max 50 warnings)
        run: npm run lint -- --max-warnings 50

  # ── 2. Аудит безопасности — клиент ─────────────────────────────────────────
  client-audit:
    name: Security audit (client)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install client dependencies
        run: npm install --legacy-peer-deps
        continue-on-error: true

      - name: npm audit (client)
        run: npm audit --audit-level=high
        # RN peer-dep vulnerabilities часто вне нашего контроля
        continue-on-error: true
